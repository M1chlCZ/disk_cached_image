name: disk_cached_image
description: >-
  A Flutter widget and cache service that downloads network images to disk
  once, serves them from disk, and supports TTL, eviction, and clearing.
version: 0.1.1
repository: https://github.com/M1chlCZ/disk_cached_image
issue_tracker: https://github.com/M1chlCZ/disk_cached_image/issues
topics:
  - widget
  - image
  - cache
  - disk
  - network
environment:
  sdk: ^3.11.0
dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  path_provider: ^2.1.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
